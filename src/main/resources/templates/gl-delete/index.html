<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>Hapus Batch — AUSY</title></head>
<main>
  <h1 class="ausy-page-title">Hapus Batch</h1>
  <p class="text-muted">Hapus batch GL aktif (sinkron dengan List GL).</p>
  <div th:if="${ok}" class="alert alert-success py-2" th:text="${ok}"></div>
  <div th:if="${warn}" class="alert alert-warning py-2" th:text="${warn}"></div>

  <div class="ausy-card">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>No</th><th>Batch</th><th>Uploader</th><th class="text-end">Jml Baris</th><th>Aksi</th></tr></thead>
      <tbody>
      <tr th:each="p,i : ${pakets}">
        <td th:text="${i.count}"></td>
        <td><span class="badge bg-primary-subtle text-primary">BATCH <span th:text="${p[0]}"></span></span></td>
        <td th:text="${p[1]}"></td>
        <td class="text-end" th:text="${p[2]}"></td>
        <td>
          <th:block th:with="key=${p[0] + '|' + p[1]},
                             diajukan=${pendingKeys != null and pendingKeys.contains(p[0] + '|' + p[1])},
                             dataPending=${pendingRows != null ? pendingRows.get(p[0] + '|' + p[1]) : null}">
            <span th:if="${diajukan}" class="badge bg-warning-subtle text-warning">
              <i class="fa-solid fa-hourglass-half"></i> Menunggu Otorisasi
            </span>
            <!-- BUG_AUSY_00096: batch dengan baris GL yang masih menunggu otorisasi tidak bisa dihapus -->
            <span th:if="${!diajukan and dataPending != null and !dataPending.isEmpty()}"
                  class="badge bg-warning-subtle text-warning">
              <i class="fa-solid fa-hourglass-half"></i> Ada Data Menunggu Otorisasi (ID
              <span th:text="${#strings.listJoin(dataPending, ', ')}"></span>)
            </span>
            <button th:if="${!diajukan and (dataPending == null or dataPending.isEmpty())}"
                    type="button" class="btn btn-sm btn-outline-danger btn-del-batch"
                    th:attr="data-paket=${p[0]},data-inputer=${p[1]}"><i class="fa-solid fa-trash"></i>
              <span th:text="${needApproval} ? 'Ajukan Hapus Batch' : 'Hapus Batch'">Hapus Batch</span></button>
          </th:block>
        </td>
      </tr>
      <tr th:if="${pakets.isEmpty()}"><td colspan="5" class="text-center text-muted py-3">Tidak ada batch.</td></tr>
      </tbody>
    </table>
  </div>

  <div class="modal fade" id="delBatch" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form th:action="@{/gl-delete/process}" method="post">
      <div class="modal-header"><h5 class="modal-title">Hapus Batch <span id="db_label"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" name="paket" id="db_paket"><input type="hidden" name="inputer" id="db_inputer">
        <div th:if="${needApproval}"><label class="form-label">Alasan <span class="text-danger">*</span></label>
          <textarea class="form-control" name="note" rows="2" placeholder="Alasan penghapusan batch" required></textarea></div>
        <p class="text-muted small mb-0 mt-2">Seluruh baris GL pada batch ini akan dihapus.</p>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-danger" th:text="${needApproval} ? 'Ajukan Hapus Batch' : 'Hapus Batch'">Hapus Batch</button></div>
    </form>
  </div></div></div>

  <script>
    (function(){
      var m=new bootstrap.Modal(document.getElementById('delBatch'));
      document.querySelectorAll('.btn-del-batch').forEach(function(b){b.addEventListener('click',function(){
        document.getElementById('db_paket').value=b.dataset.paket;
        document.getElementById('db_inputer').value=b.dataset.inputer;
        document.getElementById('db_label').textContent=b.dataset.paket;
        m.show();
      });});
    })();
  </script>
</main>
</html>
