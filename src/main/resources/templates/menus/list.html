<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>Menu — AUSY</title></head>
<main>
  <h1 class="ausy-page-title">Menu</h1>
  <p class="text-muted">Perubahan menu <b>butuh alasan</b> dan menunggu approval Admin Approval (dual control).</p>
  <div th:if="${ok}" class="alert alert-info py-2" th:text="${ok}"></div>
  <div th:if="${pendingConfig > 0}" class="alert alert-warning py-2"><i class="fa-solid fa-clock"></i> <b th:text="${pendingConfig}">0</b> perubahan config menunggu otorisasi Admin Approval.</div>
  <div class="ausy-card">
    <table class="table table-hover align-middle mb-0 dt">
      <thead><tr><th>ID</th><th>Nama Menu</th><th>URL</th><th>Parent</th><th>Urutan</th><th>Aksi</th></tr></thead>
      <tbody>
      <tr th:each="m : ${menus}" th:classappend="${m.parent==0}?'table-light':''">
        <td th:text="${m.idMenu}"></td>
        <td><b th:if="${m.parent==0}" th:text="${m.namaMenu}"></b><span th:if="${m.parent!=0}" th:text="${m.namaMenu}"></span></td>
        <td><code th:text="${m.url}"></code></td>
        <td th:text="${m.parent==0?'(induk)':parentName.get(m.parent)}"></td>
        <td th:text="${m.urutan}"></td>
        <td th:with="pending=${pendingIds != null and pendingIds.contains('' + m.idMenu)}">
          <span th:if="${pending}" class="badge bg-warning-subtle text-warning">
            <i class="fa-solid fa-hourglass-half"></i> Menunggu Otorisasi</span>
          <th:block th:unless="${pending}">
          <button class="btn btn-sm btn-outline-secondary btn-edit"
            th:attr="data-id=${m.idMenu},data-nama=${m.namaMenu},data-url=${m.url},data-parent=${m.parent},data-urutan=${m.urutan}"
            data-bs-toggle="modal" data-bs-target="#editM">Ubah</button>
          </th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="modal fade" id="editM" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form th:action="@{/menus/edit}" method="post">
      <div class="modal-header"><h5 class="modal-title">Ubah Menu</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" name="idMenu" id="m_id">
        <div class="mb-2"><label class="form-label">Nama Menu <span class="text-danger">*</span></label><input class="form-control" name="namaMenu" id="m_nama" required></div>
        <!--/* BUG_AUSY_00145: URL hanya ditampilkan, tidak bisa diubah — mengubahnya membuat menu
               menunjuk ke alamat yang tidak ada (whitelabel error page). Sengaja tanpa atribut
               name= supaya nilainya tidak ikut terkirim sama sekali. */-->
        <div class="mb-2"><label class="form-label">URL</label>
          <input class="form-control" id="m_url" disabled readonly>
          <div class="form-text">URL halaman tidak dapat diubah — nilainya mengikuti alamat yang dilayani aplikasi.</div></div>
        <div class="mb-2"><label class="form-label">Parent</label>
          <select class="form-select" name="parent" id="m_parent"><option value="0">(induk / tanpa parent)</option>
            <option th:each="p : ${parents}" th:value="${p.idMenu}" th:text="${p.namaMenu}"></option></select></div>
        <div class="mb-2"><label class="form-label">Urutan</label><input class="form-control" type="number" name="urutan" id="m_urutan"></div>
        <div class="mb-2"><label class="form-label">Alasan / reason <span class="text-danger">*</span></label><textarea class="form-control" name="note" rows="2" required placeholder="Dikirim ke Admin Approval"></textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary">Simpan</button></div>
    </form>
  </div></div></div>
  <script>
  document.querySelectorAll('.btn-edit').forEach(function(b){b.addEventListener('click',function(){
    m_id.value=b.dataset.id; m_nama.value=b.dataset.nama||''; m_url.value=b.dataset.url||'';
    m_parent.value=b.dataset.parent||'0'; m_urutan.value=b.dataset.urutan||'0';});});
  </script>
</main>
</html>
