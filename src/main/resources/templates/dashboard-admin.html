<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>Beranda — AUSY</title></head>
<main>
    <h1 class="ausy-page-title">Beranda Admin</h1>
    <p class="text-muted">Konfigurasi user &amp; group.</p>

    <div class="dash-grid">
        <div class="dash-card">
            <div class="dash-ico c-accent"><i class="fa-solid fa-users"></i></div>
            <div><div class="dash-num" th:text="${totalUsers}">0</div><div class="dash-label">Total User</div></div>
        </div>
        <div class="dash-card">
            <div class="dash-ico c-info"><i class="fa-solid fa-user-shield"></i></div>
            <div><div class="dash-num" th:text="${totalGroups}">0</div><div class="dash-label">Group</div></div>
        </div>
    </div>

    <!-- Riwayat User: add/edit/delete + approve/reject -->
    <div class="ausy-card">
        <h2 class="h6 mb-0 px-3 pt-3 pb-2 d-flex align-items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-muted"></i> Riwayat User
            <span class="text-muted fw-normal small">— add / edit / delete &amp; approve / reject</span></h2>
        <div class="px-3 pb-3">
            <table class="table table-sm table-hover align-middle mb-0 dt" data-order-col="0" data-order-dir="desc">
                <thead><tr><th>Waktu</th><th>Oleh</th><th>Aktivitas</th><th>Detail</th></tr></thead>
                <tbody>
                <tr th:each="h : ${userHistory}">
                    <td class="text-nowrap text-muted small"
                        th:attr="data-order=${#temporals.format(h.timeActivity,'yyyyMMddHHmm')}"
                        th:text="${#temporals.format(h.timeActivity,'dd-MM-yyyy HH:mm')}"></td>
                    <td th:text="${h.userId}"></td>
                    <td><span class="badge"
                              th:classappend="${#strings.contains(h.nameActivity,'APPROVE')} ? 'bg-success-subtle text-success' : (${#strings.contains(h.nameActivity,'REJECT')} ? 'bg-danger-subtle text-danger' : 'bg-secondary-subtle text-secondary')"
                              th:text="${h.nameActivity}"></span></td>
                    <td class="small" th:text="${h.tinfo}"></td>
                </tr>
                <tr th:if="${userHistory.isEmpty()}"><td colspan="4" class="text-center text-muted py-4">Belum ada riwayat perubahan user.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</html>
