<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>Upload Excel — AUSY</title></head>
<main>
  <h1 class="ausy-page-title">Upload Excel</h1>
  <p class="text-muted">Unggah file jurnal GL. Data pada kolom <b>Posting Date</b> harus bertanggal hari ini.</p>

  <div th:if="${result}" class="mb-3">
    <div th:if="${result.success}" class="alert" th:classappend="${result.balanced} ? 'alert-success' : 'alert-warning'">
      <b th:text="${result.message}"></b><br>
      <span>Debit: <b th:text="${#numbers.formatDecimal(result.debit,1,'POINT',2,'COMMA')}"></b>
            &nbsp;·&nbsp; Credit: <b th:text="${#numbers.formatDecimal(result.credit,1,'POINT',2,'COMMA')}"></b></span>
    </div>
    <div th:unless="${result.success}" class="alert alert-danger">
      <b th:text="${result.message}"></b>
      <table th:if="${!result.errors.isEmpty()}" class="table table-sm mt-2 mb-0">
        <thead><tr><th>Baris</th><th>Keterangan</th></tr></thead>
        <tbody><tr th:each="e : ${result.errors}"><td th:text="${e[0]}"></td><td th:text="${e[1]}"></td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="ausy-card" style="padding:22px">
    <!--/* BUG_AUSY_00181: tombol Download Template disembunyikan. Sheet referensi di dalamnya —
           Product_Code, COA, Cost_Center, Branch_Code — berisi salinan daftar MNC yang TIDAK ikut
           diperbarui sendiri; begitu daftarnya berubah di sisi MNC, template yang beredar
           menyesatkan. Endpoint-nya sengaja dibiarkan hidup supaya tautan yang sudah terlanjur
           dibagikan tidak mati, dan supaya tombolnya gampang dimunculkan lagi begitu daftar
           referensinya punya cara memperbarui diri. */-->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <b><i class="fa-solid fa-file-excel"></i> Upload File Excel</b>
    </div>
    <form th:action="@{/upload/process}" method="post" enctype="multipart/form-data" class="row g-2 align-items-end">
      <div class="col"><input class="form-control" type="file" name="file" accept=".xlsx,.xls" required></div>
      <div class="col-auto"><button class="btn btn-primary"><i class="fa-solid fa-upload"></i> Upload</button></div>
    </form>
  </div>
</main>
</html>
