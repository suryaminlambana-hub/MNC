<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>Hapus Batch — AUSY</title></head>
<main>
  <h1 class="ausy-page-title">Hapus Batch</h1>
  <p class="text-muted">Hapus batch GL aktif (sinkron dengan List GL).</p>
  <div th:if="${ok}" class="alert alert-success py-2" th:text="${ok}"></div>
  <div th:if="${warn}" class="alert alert-warning py-2" th:text="${warn}"></div>

  <div th:if="${needApproval}" class="alert alert-info py-2">
    <i class="fa-solid fa-user-shield"></i>
    Penghapusan batch memerlukan <b>otorisasi Checker</b>. Batch baru terhapus setelah Checker menyetujui
    permintaan Anda pada menu <b>Manajemen Otorisasi GL</b>.
  </div>
  <div class="ausy-card">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>No</th><th>Batch</th><th>Uploader</th><th class="text-end">Jml Baris</th><th>Aksi</th></tr></thead>
      <tbody>
      <tr th:each="p,i : ${pakets}">
        <td th:text="${i.count}"></td>
        <td><span class="badge bg-primary-subtle text-primary">BATCH <span th:text="${p[0]}"></span></span></td>
        <td th:text="${p[1]}"></td>
        <td class="text-end" th:text="${p[2]}"></td>
        <td>
          <span th:if="${pendingKeys != null and pendingKeys.contains(p[0] + '|' + p[1])}" class="badge bg-info-subtle text-info">
            <i class="fa-solid fa-hourglass-half"></i> Menunggu Otorisasi
          </span>
          <form th:unless="${pendingKeys != null and pendingKeys.contains(p[0] + '|' + p[1])}"
                th:action="@{/gl-delete/process}" method="post" class="d-inline"
                onsubmit="return confirm('Lanjutkan hapus batch ini?');">
            <input type="hidden" name="paket" th:value="${p[0]}"><input type="hidden" name="inputer" th:value="${p[1]}">
            <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i>
              <span th:text="${needApproval} ? 'Ajukan Hapus Batch' : 'Hapus Batch'">Hapus Batch</span></button>
          </form>
        </td>
      </tr>
      <tr th:if="${pakets.isEmpty()}"><td colspan="5" class="text-center text-muted py-3">Tidak ada batch.</td></tr>
      </tbody>
    </table>
  </div>
</main>
</html>
