<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){var t=localStorage.getItem('ausy-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
    <title>Login — AUSY</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.2/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css(v=16)}">
</head>
<body class="ausy-login-bg">
<div class="ausy-login-card">
    <div class="ausy-login-brand"><i class="fa-solid fa-building-columns"></i> MNC <b>AUSY</b></div>
    <p class="text-muted">Accounting Upload System</p>

    <div th:if="${param.error}" class="alert alert-danger py-2">Username atau password salah.</div>
    <div th:if="${param.logout}" class="alert alert-success py-2">Anda telah keluar.</div>
    <div th:if="${param.expired}" class="alert alert-warning py-2">Sesi berakhir, silakan login lagi.</div>

    <form id="loginForm" th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="ausy-pw">
                <input type="password" name="password" id="password" class="form-control" required>
                <button type="button" class="ausy-pw-toggle" id="pwToggle" aria-label="Tampilkan password" tabindex="-1">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Masuk</button>
    </form>

</div>
<script>
    (function(){
        var pw=document.getElementById('password'), tg=document.getElementById('pwToggle');
        tg.addEventListener('click', function(){
            var show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            tg.querySelector('i').className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            tg.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
        });
    })();
    // Pesan error bahasa Indonesia bila username/password kosong (BUG_00047) — di-reset otomatis
    // supaya tidak "nyangkut" setelah field diisi via autofill/paste (BUG_00053).
    (function(){
        document.addEventListener('invalid', function(e){
            var el = e.target;
            if(el && el.validity && el.validity.valueMissing){
                el.setCustomValidity((el.name === 'username' ? 'Username' : 'Password') + ' wajib diisi.');
                setTimeout(function(){ el.setCustomValidity(''); }, 50);   // clear so it never blocks next submit
            }
        }, true);
        document.addEventListener('input', function(e){ if(e.target.setCustomValidity) e.target.setCustomValidity(''); }, true);
    })();
</script>
</body>
</html>
