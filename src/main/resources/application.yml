server:
  port: 8080
  servlet:
    context-path: ${CONTEXT_PATH:/ausy}
    # REQ_AUSY_00072: cookie sesi tidak ikut terkirim pada request lintas situs (POST dari situs
    # lain), dan tidak terbaca JavaScript. Lax = default aman; Strict bisa dipasang lewat .env.
    session:
      cookie:
        http-only: true
        same-site: ${AUSY_COOKIE_SAMESITE:lax}
  # Aplikasi dipublish di belakang reverse proxy (dev-ausy.mncbank.co.id / Safous):
  # hormati X-Forwarded-* supaya redirect setelah login memakai alamat publik,
  # bukan alamat internal 10.5.99.24:8080 yang tidak bisa dijangkau browser user.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: ausy
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ausy}
    username: ${DB_USER:ausy_user}
    password: ${DB_PASS:ausy_pass_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none           # Flyway owns the schema
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  thymeleaf:
    cache: false                # dev; enable in prod
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true        # always revalidate CSS/JS so UI changes show without a hard refresh

ausy:
  # REQ_AUSY_00060 — login berakhir setelah sekian lama TANPA aktivitas (klik, scroll, ketik,
  # submit). Timer di browser yang menghitungnya dan me-logout; sesi di server diberi lebih
  # 1 menit sebagai pengaman (SessionIdle). Format Duration: 10m, 600s, ...
  session-idle: ${AUSY_SESSION_IDLE:10m}
  # Folder tempat file ACCTXT hasil export ditulis; core banking mengambilnya dari sana.
  # Arahkan ke root FTP lokal mesin ini (mis. C:/inetpub/ftproot). Kosong / tidak bisa dipakai
  # = bawaan: C:/inetpub/ftproot di Windows, data/txt di OS lain. Folder yang berlaku disebut
  # di log saat start: "File hasil export ditulis ke ...".
  txt-dir: ${AUSY_TXT_DIR:}
  export-dir: ${AUSY_EXPORT_DIR:}
  # REQ_AUSY_00061 — saklar penjadwal tingkat server. false = penjadwal tidak dipasang sama
  # sekali: tidak ada jalan otomatis, tidak ada susulan, dan tombolnya hilang dari layar.
  # Bawaan false: jadwal generate diatur MNC sendiri lewat ausy-trigger.jar (REQ_AUSY_00058).
  scheduler-enabled: ${AUSY_SCHEDULER_ENABLED:false}
  # REQ_AUSY_00058 — token rahasia yang dibawa ausy-trigger.jar saat "menekan" tombol Generate
  # ACCTXT (POST /api/acctxt/generate). Kosong = pemicu JAR dimatikan.
  trigger-token: ${AUSY_TRIGGER_TOKEN:}
  # REQ_AUSY_00061 — kapan berkas ACCTXT dibuat otomatis. Bawaan: tiap hari jam 23:00 WIB.
  # Penjadwalnya masih bisa dimatikan dari halaman Generate File ACCTXT tanpa mengubah ini.
  scheduler-cron: ${AUSY_SCHEDULER_CRON:0 0 23 * * *}
  # Setelah ditulis, file ACCTXT dikirim ke FTP MNC (BUG_AUSY_00189). FTP_HOST kosong = tidak dikirim.
  ftp:
    host: ${FTP_HOST:}
    port: ${FTP_PORT:21}
    user: ${FTP_USER:}
    pass: ${FTP_PASS:}
    dir: ${FTP_DIR:}
    passive: ${FTP_PASSIVE:true}
  # Diisi Maven saat build (lihat <resources> di pom.xml), bukan diketik tangan. Ditampilkan di
  # layar supaya "aplikasi yang jalan ini build kapan" bisa dibaca, bukan ditebak.
  build-time: '@maven.build.timestamp@'

logging:
  level:
    org.springframework.security: INFO
