<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<body>
<!--/* Daftar pengajuan perubahan untuk checker, dipakai dua tab: Otorisasi Kelola Data GL dan
       Otorisasi Manajemen Kode GL (REQ_AUSY_00049). list = daftar ReviewItem, kosong = teks bila kosong. */-->
<th:block th:fragment="crList(list, kosong)">
      <div class="ausy-review">
        <div th:if="${list.isEmpty()}" class="ausy-card text-center text-muted py-4">
          <span th:text="${kosong}">Tidak ada pengajuan.</span>
        </div>
        <div class="ausy-card mb-3" th:each="it : ${list}" style="padding:16px 18px">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <div class="d-flex align-items-center gap-2">
              <span class="badge fs-6"
                    th:classappend="${it.cr.op == 'ADD'} ? 'bg-success' : (${it.cr.op == 'DELETE'} ? 'bg-danger' : (${it.cr.op == 'BULK_EDIT'} ? 'bg-info text-dark' : 'bg-primary'))"
                    th:text="${it.cr.op == 'BULK_EDIT' ? 'BULK EDIT' : it.cr.op}">EDIT</span>
              <span class="badge bg-secondary-subtle text-secondary" th:text="${it.targetLabel}">Data GL</span>
              <span class="fw-semibold">CR#<span th:text="${it.cr.id}"></span></span>
              <span class="text-muted">· maker <b th:text="${@nama.of(it.cr.maker)}"></b></span>
              <span class="text-muted" th:if="${it.cr.glId}">· baris #<span th:text="${it.cr.glId}"></span></span>
              <span class="text-muted" th:if="${it.cr.target == 'PAKET'}">· batch <b th:text="${@batchLabel.of(it.cr.noPaket)}"></b></span>
            </div>
            <span class="text-muted small" th:text="${#temporals.format(it.cr.createdAt,'dd-MM-yyyy HH:mm')}"></span>
          </div>

          <div th:if="${it.cr.op == 'BULK_EDIT'}" class="mb-2">
            <p class="mb-2"><i class="fa-solid fa-file-excel text-muted"></i>
              Bulk edit via Excel — <b th:text="${it.bulkCount}">0</b> baris diubah. Unduh &amp; bandingkan:</p>
            <div class="d-flex gap-2 flex-wrap">
              <a class="btn btn-sm btn-outline-secondary" th:href="@{'/gl-change/' + ${it.cr.id} + '/export/before'}"><i class="fa-solid fa-download"></i> Export Before</a>
              <a class="btn btn-sm btn-outline-secondary" th:href="@{'/gl-change/' + ${it.cr.id} + '/export/after'}"><i class="fa-solid fa-download"></i> Export After</a>
            </div>
          </div>

          <!-- import CSV Kode GL: daftar baris yang akan ditambahkan -->
          <div th:if="${it.cr.op == 'IMPORT'}" class="mb-2">
            <p class="mb-2"><i class="fa-solid fa-file-csv text-muted"></i>
              Import CSV — <b th:text="${#lists.size(it.rows)}">0</b> Kode GL akan ditambahkan:</p>
            <table class="table table-sm align-middle mb-0 ausy-diff">
              <thead><tr><th style="width:25%">NoGL</th><th>Description</th></tr></thead>
              <tbody>
                <tr th:each="r : ${it.rows}">
                  <td><code th:text="${r.code}"></code></td>
                  <td th:text="${r.description}"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <table th:if="${it.cr.op == 'ADD'}" class="table table-sm align-middle mb-2 ausy-diff ausy-diff-kv">
            <thead><tr><th>Field</th><th>Nilai Baru</th></tr></thead>
            <tbody>
            <tr th:each="d : ${it.diffs}"><td class="text-muted" th:text="${d.label}"></td><td><b th:text="${d.after}"></b></td></tr>
            </tbody>
          </table>

          <table th:if="${it.cr.op == 'EDIT' or it.cr.op == 'DELETE'}" class="table table-sm align-middle mb-2 ausy-diff">
            <thead><tr><th style="width:30%">Field</th><th style="width:35%">Before</th><th style="width:35%">After</th></tr></thead>
            <tbody>
            <tr th:each="d : ${it.diffs}" th:classappend="${d.changed} ? 'table-warning'">
              <td class="text-muted" th:text="${d.label}"></td>
              <td th:text="${d.before}"></td>
              <td><b th:if="${d.changed}" th:text="${d.after}"></b><span th:unless="${d.changed}" th:text="${d.after}"></span></td>
            </tr>
            </tbody>
          </table>

          <p class="small text-muted mb-3" th:if="${it.cr.noteMaker}"><i class="fa-solid fa-comment-dots"></i> Justifikasi maker: <span th:text="${it.cr.noteMaker}"></span></p>

          <div class="d-flex gap-2">
            <form th:action="@{/gl-change/approve}" method="post" onsubmit="return confirm('Approve &amp; terapkan perubahan ini?');">
              <input type="hidden" name="crId" th:value="${it.cr.id}">
              <button class="btn btn-sm btn-success"><i class="fa-solid fa-check"></i> Approve</button>
            </form>
            <button class="btn btn-sm btn-outline-danger btn-reject-cr" th:attr="data-cr=${it.cr.id}"><i class="fa-solid fa-xmark"></i> Reject</button>
          </div>
        </div>
      </div>
</th:block>
</body>
</html>
