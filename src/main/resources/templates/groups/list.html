<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>Role — AUSY</title></head>
<main>
  <h1 class="ausy-page-title">Role</h1>
  <p class="text-muted">Perubahan role <b>butuh alasan</b> dan menunggu approval Admin Approval (dual control).</p>
  <div th:if="${ok}" class="alert alert-info py-2" th:text="${ok}"></div>
  <div th:if="${pendingConfig > 0}" class="alert alert-warning py-2"><i class="fa-solid fa-clock"></i> <b th:text="${pendingConfig}">0</b> perubahan config menunggu otorisasi Admin Approval.</div>
  <div class="ausy-card">
    <table class="table table-hover align-middle mb-0 dt">
      <thead><tr><th>No</th><th>Nama Role</th><th>Inisial</th><th>Level</th><th>Aksi</th></tr></thead>
      <tbody>
      <tr th:each="g,i : ${groups}">
        <td th:text="${i.count}">1</td><td><b th:text="${g.namaGroup}"></b></td>
        <td th:text="${g.inisial}"></td><td th:text="${g.level}"></td>
        <td th:with="pending=${pendingIds != null and pendingIds.contains('' + g.idGroup)},
                     terpakai=${inUse != null and inUse.contains(g.idGroup)}">
          <span th:if="${pending}" class="badge bg-warning-subtle text-warning">
            <i class="fa-solid fa-hourglass-half"></i> Menunggu Otorisasi</span>
          <th:block th:unless="${pending}">
          <!--/* BUG_AUSY_00111: role yang masih dipakai user ditandai; tombol Hapus sendiri
                 sudah tidak ada sejak BUG_AUSY_00118 (di luar requirement). */-->
          <span th:if="${terpakai}" class="badge bg-warning-subtle text-warning me-1">
            <i class="fa-solid fa-lock"></i> Terpakai</span>
          <button class="btn btn-sm btn-outline-secondary btn-edit"
            th:attr="data-id=${g.idGroup},data-nama=${g.namaGroup},data-ini=${g.inisial},data-lvl=${g.level}"
            data-bs-toggle="modal" data-bs-target="#editG">Ubah</button>
          </th:block>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="modal fade" id="editG" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form th:action="@{/groups/edit}" method="post">
      <div class="modal-header"><h5 class="modal-title">Ubah Role</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" name="idGroup" id="g_id">
        <div class="mb-2"><label class="form-label">Nama Role <span class="text-danger">*</span></label><input class="form-control" name="namaGroup" id="g_nama" required></div>
        <div class="mb-2"><label class="form-label">Inisial</label><input class="form-control" name="inisial" id="g_ini"></div>
        <div class="mb-2"><label class="form-label">Level</label><input class="form-control" name="level" id="g_lvl"></div>
        <div class="mb-2"><label class="form-label">Alasan / reason <span class="text-danger">*</span></label><textarea class="form-control" name="note" rows="2" required placeholder="Dikirim ke Admin Approval"></textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary">Simpan</button></div>
    </form>
  </div></div></div>
  <script>
  document.querySelectorAll('#editG ~ * , .btn-edit').forEach(function(){});
  document.querySelectorAll('.btn-edit').forEach(function(b){b.addEventListener('click',function(){
    g_id.value=b.dataset.id; g_nama.value=b.dataset.nama||''; g_ini.value=b.dataset.ini||''; g_lvl.value=b.dataset.lvl||'';});});
  </script>
</main>
</html>
