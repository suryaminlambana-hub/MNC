# Konfigurasi acuan nginx di depan AUSY (reverse proxy ke 127.0.0.1:8080, konteks /ausy).
# Pasang sebagai /etc/nginx/conf.d/ausy.conf, lalu:  nginx -t && systemctl reload nginx
#
# Temuan pentest yang dijawab di sini:
#   - "Server header discloses version/software info: 'nginx'"  -> server_tokens off (+ opsi more_clear_headers)
#   - rate limit pada login                                     -> limit_req di /ausy/login
#   - CORS 'Access-Control-Allow-Origin: *'                     -> JANGAN menambah header CORS di sini
#
# PENTING: X-Forwarded-For harus diteruskan. Aplikasi membaca IP klien dari header ini
# (server.forward-headers-strategy=framework). Tanpa itu semua pengguna tampak berasal dari 127.0.0.1,
# sehingga pembatas login per IP (30 gagal / 15 menit) berlaku untuk SEMUA orang sekaligus dan
# jejak audit login mencatat 127.0.0.1.

# Zona pembatas laju. Hapus baris ini bila zona "one" sudah didefinisikan di nginx.conf.
limit_req_zone $binary_remote_addr zone=one:10m rate=30r/m;

server {
    listen 80;
    server_name new-ausy.mncbank.co.id;

    # Sembunyikan versi nginx dari header Server dan halaman galat. Rekomendasi penguji: taruh juga di blok
    # http {} pada /etc/nginx/nginx.conf supaya berlaku untuk semua server (termasuk server bawaan).
    server_tokens off;
    # Header Server tetap berisi kata "nginx" karena nginx bawaan tidak bisa menghapusnya. Untuk
    # menghapus seluruhnya, pasang modul headers-more (mis. nginx-mod-headers-more) lalu aktifkan:
    # more_clear_headers Server;

    # Batas unggah (aplikasi menerima berkas sampai 30 MB).
    client_max_body_size 35m;

    # Jangan menambah header Access-Control-Allow-Origin di sini; aplikasi tidak butuh CORS.

    location /ausy/login {
        limit_req zone=one burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # bukan $proxy_add_x_forwarded_for: cegah IP palsu dari klien
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Bila 502 Bad Gateway padahal aplikasi hidup (RHEL/SELinux):  setsebool -P httpd_can_network_connect 1
# Bila firewalld aktif di server ini:  firewall-cmd --permanent --add-service=http && firewall-cmd --reload
#
# TLS (443) menyusul setelah sertifikat siap: salin blok server di atas, ganti "listen 80;" dengan
#   listen 443 ssl;  ssl_certificate ...;  ssl_certificate_key ...;
# dan tambahkan server { listen 80; return 301 https://$host$request_uri; } untuk pengalihan.
