<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>Legacy - List GL — AUSY</title></head>
<main>
  <h1 class="ausy-page-title">List Data GL</h1>
  <p class="text-muted">Seluruh baris jurnal GL yang ada di sistem.</p>
  <div class="ausy-card">
    <table class="table table-sm table-hover align-middle mb-0 dt">
      <thead><tr><th>Paket</th><th>NoGL</th><th>D/C</th><th>GL Name</th><th>Description</th><th class="text-end">Amount</th><th>Tgl</th><th>Uploader</th><th>GLTRRF</th></tr></thead>
      <tbody>
      <tr th:each="g : ${rows}">
        <td th:text="${g.noPaket}"></td><td><code th:text="${g.gltrac}"></code></td>
        <td th:text="${g.gltrcd}"></td><td th:text="${g.glName}"></td><td th:text="${g.gltrds}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(g.gltram,1,'POINT',2,'COMMA')}"></td>
        <td th:text="${g.gltrpd}"></td><td th:text="${g.gltrus}"></td><td><small th:text="${g.gltrrf}"></small></td>
      </tr>
      <tr th:if="${rows.isEmpty()}"><td colspan="9" class="text-center text-muted py-3">Belum ada data GL.</td></tr>
      </tbody>
    </table>
  </div>
</main>
</html>
