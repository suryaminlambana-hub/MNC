<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- REQ_AUSY_00032: visual korporat MNC untuk latar halaman login — navy dengan motif belah
       ketupat emas dari logo MNC. Pengganti sementara sampai ada foto resmi MNC. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16406F"/>
      <stop offset="0.55" stop-color="#102D50"/>
      <stop offset="1" stop-color="#0A1D36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#C99A33" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C99A33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3B750"/>
      <stop offset="1" stop-color="#B28628"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- belah ketupat besar, motif logo MNC -->
  <g transform="translate(1250 420) rotate(45)" fill="none" stroke="url(#gold)">
    <rect x="-260" y="-260" width="520" height="520" rx="70" stroke-width="3" stroke-opacity="0.55"/>
    <rect x="-190" y="-190" width="380" height="380" rx="52" stroke-width="2" stroke-opacity="0.35"/>
    <rect x="-120" y="-120" width="240" height="240" rx="34" stroke-width="1.5" stroke-opacity="0.25"/>
  </g>
  <circle cx="1250" cy="420" r="70" fill="none" stroke="#E3B750" stroke-opacity="0.45" stroke-width="3"/>

  <!-- belah ketupat kecil sebagai aksen -->
  <g fill="none" stroke="#C99A33">
    <rect x="-60" y="-60" width="120" height="120" rx="16" transform="translate(240 820) rotate(45)" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="-34" y="-34" width="68" height="68" rx="10" transform="translate(420 140) rotate(45)" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="-24" y="-24" width="48" height="48" rx="7" transform="translate(980 900) rotate(45)" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- garis tipis diagonal -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="700" x2="700" y2="0"/>
    <line x1="0" y1="900" x2="900" y2="0"/>
    <line x1="300" y1="1000" x2="1300" y2="0"/>
    <line x1="700" y1="1000" x2="1600" y2="100"/>
  </g>
</svg>
