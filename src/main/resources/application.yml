server:
  port: 8080
  servlet:
    context-path: ${CONTEXT_PATH:/ausy}

spring:
  application:
    name: ausy
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ausy_sb}
    username: ${DB_USER:erosjovian}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none           # Flyway owns the schema
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  thymeleaf:
    cache: false                # dev; enable in prod

ausy:
  txt-dir: ${AUSY_TXT_DIR:data/txt}
  ftp:
    host: ${FTP_HOST:}          # empty -> FTP push dimatikan (file tetap dibuat lokal)
    port: ${FTP_PORT:21}
    user: ${FTP_USER:}
    pass: ${FTP_PASS:}
    dir: ${FTP_DIR:}            # folder tujuan di server FTP (opsional)
    secure: ${FTP_SECURE:false} # true = FTPS (FTP over TLS)
    passive: ${FTP_PASSIVE:true}

logging:
  level:
    org.springframework.security: INFO
