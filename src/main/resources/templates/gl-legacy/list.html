<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>List GL Aktif — AUSY</title></head>
<main>
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
    <div>
      <h1 class="ausy-page-title">List GL Aktif</h1>
      <p class="text-muted mb-0">Total <b th:text="${total}">0</b> baris jurnal ·
        <span th:text="${totalRegistered}">0</span> terdaftar ·
        nilai <b th:text="${#numbers.formatDecimal(totalAmount,1,'POINT',2,'COMMA')}">0</b></p>
    </div>
    <form id="exportForm" method="post" th:action="@{/gl-legacy/export-request}">
      <button type="submit" class="btn btn-primary" onclick="return confirmExport();">
        <i class="fa-solid fa-paper-plane"></i> Ajukan Export
        <span class="badge bg-light text-primary ms-1" th:if="${exportableCount > 0}" th:text="${exportableCount}">0</span>
      </button>
    </form>
  </div>
  <div th:if="${ok}" class="alert alert-success py-2" th:text="${ok}"></div>
  <div th:if="${warn}" class="alert alert-warning py-2" th:text="${warn}"></div>

  <script th:inline="javascript">
    function confirmExport() {
      var exportableCount = /*[[${exportableCount}]]*/ 0;
      var pendingExportCount = /*[[${pendingExportCount}]]*/ 0;
      if (exportableCount === 0) {
        alert(pendingExportCount > 0
          ? 'Export sebelumnya sedang menunggu approval checker.'
          : 'Tidak ada GL aktif yang belum di-export.');
        return false;
      }
      return confirm('Ajukan export seluruh GL aktif yang belum di-export ke checker?');
    }
  </script>
  <p class="text-muted small mt-1 mb-3"><i class="fa-solid fa-circle-info"></i>
     Export mengirim ACCTXT ke FTP (bukan diunduh ke komputer) dan <b>butuh otorisasi checker</b> dulu.
     Hanya GL aktif yang belum di-export yang disertakan.</p>

  <div class="ausy-card">
    <table class="table table-sm table-hover align-middle mb-0 dt">
      <thead><tr><th>ID</th><th>Paket</th><th>NoGL</th><th>D/C</th><th>GL Name</th><th>Description</th><th class="text-end">Amount</th><th>Tgl</th><th>Uploader</th><th>GLTRRF</th><th>Registered</th></tr></thead>
      <tbody>
      <tr th:each="g : ${rows}">
        <td><code class="ausy-glid" th:text="${g.id}"></code></td>
        <td th:text="${g.noPaket}"></td><td><code th:text="${g.gltrac}"></code></td>
        <td th:text="${g.gltrcd}"></td><td th:text="${g.glName}"></td><td th:text="${g.gltrds}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(g.gltram,1,'POINT',2,'COMMA')}"></td>
        <td th:text="${g.gltrpd}"></td><td th:text="${g.gltrus}"></td><td><small th:text="${g.gltrrf}"></small></td>
        <td>
          <span th:if="${registered.contains(g.gltrac + '|' + g.gltrcd)}" class="badge bg-success-subtle text-success">Terdaftar</span>
          <span th:unless="${registered.contains(g.gltrac + '|' + g.gltrcd)}" class="badge bg-secondary-subtle text-secondary">Tidak Terdaftar</span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</html>
