server:
  port: 8080
  servlet:
    context-path: ${CONTEXT_PATH:/ausy}
  # Aplikasi dipublish di belakang reverse proxy (dev-ausy.mncbank.co.id / Safous):
  # hormati X-Forwarded-* supaya redirect setelah login memakai alamat publik,
  # bukan alamat internal 10.5.99.24:8080 yang tidak bisa dijangkau browser user.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: ausy
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ausy}
    username: ${DB_USER:ausy_user}
    password: ${DB_PASS:ausy_pass_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none           # Flyway owns the schema
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  thymeleaf:
    cache: false                # dev; enable in prod
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true        # always revalidate CSS/JS so UI changes show without a hard refresh

ausy:
  # Direktori tujuan file ACCTXT. Kalau aplikasi jalan DI MESIN yang sama dengan server FTP-nya,
  # arahkan ke root FTP lokal (mis. C:/inetpub/ftproot) supaya core langsung mengambilnya dari
  # sana — tidak perlu lagi mengonfigurasi kiriman FTP (BUG_AUSY_00146). Kalau server FTP-nya di
  # MESIN LAIN, direktori ini cuma tempat file dibuat: yang mengantarkannya adalah FTP_* di .env.
  # Kosong atau tidak diisi = data/txt (relatif ke folder tempat aplikasi dijalankan).
  # Path yang berlaku disebut di log saat start: "File ACCTXT ditulis ke ...".
  txt-dir: ${AUSY_TXT_DIR:}
  export-dir: ${AUSY_EXPORT_DIR:}
  ftp:
    # false = push FTP dimatikan, apa pun isi FTP_HOST maupun baris tabel ftp_config.
    # true  = hidup, dan boleh memakai baris ftp_config kalau FTP_HOST kosong.
    # kosong = pakai FTP_HOST kalau diisi; kalau tidak, push FTP MATI dan baris ftp_config
    #          peninggalan layar Konfigurasi FTP yang lama diabaikan (BUG_AUSY_00141).
    enabled: ${FTP_ENABLED:}
    host: ${FTP_HOST:}          # kosong -> push FTP mati (file ACCTXT diambil dari direktori export)
    port: ${FTP_PORT:21}
    user: ${FTP_USER:}
    pass: ${FTP_PASS:}
    dir: ${FTP_DIR:}            # folder tujuan di server FTP (opsional)
    secure: ${FTP_SECURE:false} # true = FTPS (FTP over TLS)
    passive: ${FTP_PASSIVE:true}

logging:
  level:
    org.springframework.security: INFO
