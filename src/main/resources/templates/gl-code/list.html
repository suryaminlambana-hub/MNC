<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, ~{::main})}" lang="id">
<head><title>List GL — AUSY</title></head>
<main>
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
    <div>
      <h1 class="ausy-page-title">List GL</h1>
      <p class="text-muted mb-0">Daftar seluruh kode GL terdaftar.</p>
    </div>
    <a class="btn btn-primary" th:href="@{/gl-code/export}"><i class="fa-solid fa-file-excel"></i> Export Excel</a>
  </div>
  <div class="ausy-card">
    <table class="table table-hover align-middle mb-0 dt">
      <thead><tr><th>No</th><th>NoGL</th><th>Debit/Credit</th><th>Description</th><th>Status</th><th>Pemakaian</th></tr></thead>
      <tbody>
      <tr th:each="g,i : ${rows}">
        <td th:text="${i.count}"></td><td><code th:text="${g.code}"></code></td>
        <td><span th:class="${g.position=='C'}?'badge bg-warning-subtle text-warning':'badge bg-info-subtle text-info'" th:text="${g.position=='C'?'Credit':'Debit'}"></span></td>
        <td th:text="${g.description}"></td>
        <td th:attr="data-search=${g.status==1 ? 'Active' : 'NonAktif'},data-filter=${g.status==1 ? 'Active' : 'NonAktif'}"><span th:class="${g.status==1}?'badge bg-success-subtle text-success':'badge bg-secondary-subtle text-secondary'" th:text="${g.status==1?'Active':'Non Active'}"></span></td>
        <td><span th:if="${g.used}" class="badge bg-warning-subtle text-warning">Terpakai</span><span th:unless="${g.used}" class="text-muted small">Belum dipakai</span></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</html>
